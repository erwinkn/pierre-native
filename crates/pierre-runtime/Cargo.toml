[package]
name = "pierre-native-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Standalone GPUiX runtime with the Pierre viewport"

[lib]
crate-type = ["cdylib"]

[dependencies]
gpuix-native.workspace = true
pierre-native-view = { path = "../pierre-view", features = ["legacy"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
napi = { version = "3", features = ["napi8", "serde-json"] }
napi-derive = "3"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.127"

[build-dependencies]
napi-build = "2"

[features]
default = ["test-support"]
test-support = ["gpuix-native/test-support"]
