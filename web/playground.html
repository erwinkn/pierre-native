<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pierre Native playground</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0a0a}canvas{display:block}#loading{position:fixed;inset:0;display:grid;place-content:center;gap:12px;background:#0a0a0a;color:#b0b0b0;font:14px system-ui;padding:32px;z-index:10}#loading strong{color:#ededed;font-weight:500}#loading p{max-width:520px;line-height:1.6}</style></head><body><div id="loading" role="status"><strong>Pierre Native</strong><p>Loading the compiled playground…</p></div><script type="module">const status=document.querySelector('#loading p');if(!crossOriginIsolated){status.textContent='This page needs cross-origin isolation to run the compiled playground.';}else{import('./playground.js').catch(error=>{console.error(error);const box=document.getElementById('loading');if(box)box.querySelector('p').textContent='The playground could not start. '+error.message;});}</script></body></html>
